<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberGrid Quick Launcher</title>
    <style>
      :root { color-scheme: dark; background: #080d14; color: #d7e2ef; font: 13px Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; border: 1px solid #2a3e55; border-radius: 12px; background: #0d1520; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
      header { display: flex; align-items: center; gap: 10px; height: 54px; padding: 8px 12px; border-bottom: 1px solid #213044; -webkit-app-region: drag; }
      .mark { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #23d5ab; border-radius: 7px; color: #23d5ab; font-size: 10px; font-weight: 900; }
      input { min-width: 0; height: 36px; flex: 1; border: 0; outline: 0; background: transparent; color: #e9f2fc; font: 15px ui-monospace, monospace; -webkit-app-region: no-drag; }
      kbd { padding: 3px 6px; border: 1px solid #2a3e55; border-radius: 5px; color: #7f91a7; font-size: 9px; }
      #results { display: grid; max-height: 260px; overflow: auto; padding: 6px; }
      .result { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 10px; align-items: center; min-height: 46px; padding: 7px 9px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: inherit; cursor: pointer; text-align: left; }
      .result.selected { border-color: #2a3e55; background: #111c29; }
      .protocol { color: #23d5ab; font-size: 9px; font-weight: 900; }
      .meta { display: grid; min-width: 0; }
      .name,.endpoint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .name { font-weight: 750; }.endpoint,.group,#status { color: #7f91a7; font-size: 10px; }
      #status { padding: 18px; text-align: center; }
    </style>
  </head>
  <body>
    <header><span class="mark">CG</span><input id="query" autocomplete="off" spellcheck="false" placeholder="Search alias, hostname, IP, group, or tag…" autofocus /><kbd>Esc</kbd></header>
    <div id="results" role="listbox"></div>
    <div id="status" role="status">Loading saved connections…</div>
    <script src="./launcher.js" defer></script>
  </body>
</html>
