name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build NSIS and portable packages
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cybergrid-windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
